name: tests
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q          # fully offline: scripted model, no API key needed
      - run: EMBEDDINGS=off python -m evals.run_evals --offline
